# Reusable: render the package README via Quarto and land the result on the
# default branch through an auto-merged ggseg-bot PR. Called by each package via
# a thin caller stub that triggers on pushes/PRs touching the README source.
#
# `readme-file` defaults to README.Rmd. The ggseg atlas packages author their
# README as README.qmd, so their caller stubs pass that instead.
on:
  workflow_call:
    inputs:
      extra-repositories:
        description: >
          Extra CRAN-like repositories prepended to `repos` before dependency resolution,
          e.g. `https://ggsegverse.r-universe.dev`. Empty by default, so resolution is
          CRAN/RSPM only. Set it only while a DESCRIPTION floor names an unreleased
          sibling, and clear it before CRAN submission — otherwise CI resolves dev
          siblings and genuine CRAN-compatibility breakage goes unnoticed.
        type: string
        default: ""
      readme-file:
        description: "README source to render (e.g. README.Rmd or README.qmd)."
        type: string
        default: "README.Rmd"

name: render-readme (reusable)

permissions:
  contents: write
  pull-requests: write

jobs:
  render-readme:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Mint ggseg-bot token
        id: bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GGSEG_BOT_APP_ID }}
          private-key: ${{ secrets.GGSEG_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.bot.outputs.token }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: ${{ inputs.extra-repositories }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render README
        run: quarto render "${{ inputs.readme-file }}"

      # main is protected (PR + signed commits), so the rendered README cannot be
      # pushed to it directly. create-pull-request commits via the API, so the
      # commit is GitHub-signed; ggseg-bot is a ruleset bypass actor
      # (bypass_mode: pull_request) so it can merge without a human review.
      # This mirrors the update-codemeta reusable workflow.
      - name: Open README PR
        id: cpr
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.bot.outputs.token }}
          # A README whose plotting chunks are eval:false produces no figures,
          # so man/figures/ may legitimately not exist; a glob matching nothing
          # is skipped rather than aborting the step.
          add-paths: |
            README.md
            man/figures/**
          commit-message: "chore: re-render ${{ inputs.readme-file }}"
          branch: ci/render-readme
          delete-branch: true
          title: "chore: re-render ${{ inputs.readme-file }}"
          body: |
            Automated re-render of `${{ inputs.readme-file }}`.
            Generated by the `render-readme` reusable workflow.

      - name: Merge README PR
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          pr="${{ steps.cpr.outputs.pull-request-number }}"
          repo="${{ github.repository }}"
          branch="ci/render-readme"
          # Merge via the REST endpoint, not `gh pr merge`: the GraphQL mutation
          # behind `gh pr merge` does not honour the ggseg-bot ruleset bypass and
          # is rejected with "base branch policy prohibits the merge". The REST
          # merge endpoint honours the bypass_actor grant.
          for i in 1 2 3 4 5; do
            if gh api -X PUT "repos/$repo/pulls/$pr/merge" -f merge_method=squash; then
              echo "merged README PR #$pr"
              gh api -X DELETE "repos/$repo/git/refs/heads/$branch" || true
              exit 0
            fi
            echo "merge attempt $i not ready; retrying..."
            sleep 10
          done
          echo "::error::failed to merge README PR #$pr"
          exit 1
