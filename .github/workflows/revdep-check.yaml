# Reusable: reverse-dependency check. Installs the caller package from source
# (the version being prepared for release) and runs R CMD check on each named
# downstream ggsegverse package against it, so a breaking change is caught
# before a release is cut. Run this before minting a release version.
#
# Each downstream package is checked with the local (under-release) package
# already installed, so its own `Remotes` still resolve other ggsegverse
# dependencies from GitHub (dev-against-dev), matching how r-universe builds.
on:
  workflow_call:
    inputs:
      extra-repositories:
        description: >
          Extra CRAN-like repositories prepended to `repos` before dependency resolution,
          e.g. `https://ggsegverse.r-universe.dev`. Empty by default, so resolution is
          CRAN/RSPM only. Set it only while a DESCRIPTION floor names an unreleased
          sibling, and clear it before CRAN submission — otherwise CI resolves dev
          siblings and genuine CRAN-compatibility breakage goes unnoticed.
        type: string
        default: ""
      revdeps:
        description: >
          JSON array of downstream repositories (owner/repo) to check against
          this package, e.g. '["ggsegverse/ggseg","ggsegverse/ggseg3d"]'.
        type: string
        required: true
      install-spatial-deps:
        description: "Install GDAL/PROJ/GEOS/udunits/magick/glpk/harfbuzz system libraries (sf/terra/magick)."
        type: boolean
        default: true
      cran-rules:
        description: >
          Run the revdeps under CRAN rules, so skip_on_cran() fires and
          snapshot tests are skipped. True is the right default for the core
          consumers, whose geometry snapshots track a single ggseg.formats
          build and would false-fail against a changed upstream. Set false to
          check callers whose snapshots are the point of the check — the atlas
          packages, whose both-renderer tests are the only place one atlas is
          driven through ggseg and ggseg3d. vdiffr passes cran = FALSE to
          expect_snapshot_file(), so those tests run only when this is false.
        type: boolean
        default: true

name: revdep-check (reusable)

permissions: read-all

jobs:
  revdep:
    runs-on: ubuntu-latest

    name: revdep ${{ matrix.revdep }}

    strategy:
      fail-fast: false
      matrix:
        revdep: ${{ fromJSON(inputs.revdeps) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      RGL_USE_NULL: true
      # `r-lib/actions/setup-r` exports NOT_CRAN=true, so this overrides it.
      # cran-rules: true  -> NOT_CRAN=false -> skip_on_cran() fires, snapshots skip.
      # cran-rules: false -> NOT_CRAN=true  -> snapshots run and are the gate.
      NOT_CRAN: ${{ inputs.cran-rules && 'false' || 'true' }}

    steps:
      - name: Check out the package under release
        uses: actions/checkout@v6
        with:
          path: package

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: ${{ inputs.extra-repositories }}
          use-public-rspm: true

      - name: Install Linux system dependencies
        if: ${{ inputs.install-spatial-deps }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libproj-dev libgeos-dev libudunits2-dev libmagick++-dev libglpk-dev libharfbuzz-dev libfribidi-dev

      - name: Install the package's dependencies + tooling
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: package
          extra-packages: any::rcmdcheck any::remotes

      - name: Install the package under release
        # Installed with R CMD INSTALL rather than as `local::.` above.
        # `local::.` records a local remote whose path is relative to the
        # working-directory it was installed from, so a later
        # remotes::install_deps() run from the workspace root resolves it as
        # ./DESCRIPTION, which does not exist there, and dies with
        #   read.dcf(path) : cannot open the connection
        # in remote_sha.local_remote(). R CMD INSTALL records no remote, so
        # the revdep's own dependency resolution is unaffected.
        run: R CMD INSTALL package

      - name: Check out the reverse dependency
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.revdep }}
          path: revdep

      - name: Install reverse-dependency dependencies
        # upgrade = "never" keeps the under-release package installed above,
        # so the revdep is checked against it rather than the CRAN/r-universe
        # version. The revdep's own Remotes still resolve from GitHub.
        run: |
          remotes::install_deps("revdep", dependencies = TRUE, upgrade = "never")
        shell: Rscript {0}

      - name: R CMD check the reverse dependency
        # Raw R CMD check (not rcmdcheck) so the NOT_CRAN set above is what
        # decides whether skip_on_cran() fires. Restated inline because
        # R CMD check does not reliably inherit it (#18) — but it must read the
        # job env, not a literal. A hardcoded NOT_CRAN=false here would
        # override cran-rules and make the opt-out inert while looking
        # configured. Exits non-zero on ERROR.
        working-directory: revdep
        run: |
          pkg=$(grep -m1 '^Package:' DESCRIPTION | awk '{print $2}')
          ver=$(grep -m1 '^Version:' DESCRIPTION | awk '{print $2}')
          R CMD build --no-build-vignettes --no-manual .
          NOT_CRAN="$NOT_CRAN" R CMD check --no-manual --ignore-vignettes "${pkg}_${ver}.tar.gz"
